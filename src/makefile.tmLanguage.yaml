# yaml-language-server: $schema=https://json.schemastore.org/tmlanguage.json
---

name: Makefile
scopeName: source.makefile

comment: >-
  Originally authored by Carl Wernhoff.
  SPDX-License-Identifier: MIT

  Canonical source:
  https://github.com/carlwr/vscode-better-makefile/blob/main/src/makefile.tmLanguage.yaml

  Please propose fixes and improvements in the upstream repository.

patterns:

- include: "#comment"

- include: "#directives"

- include: "#variable-assignment"

- include: "#rulehead"

- include: "#doubleDollar"

- include: "#expansions"

- include: "#recipe-line"


# ----------------------- misc. anchors ----------------------- #

__miscAnchors:

- &SCOPE_lineCont >-
    punctuation.separator.continuation.makefile
    constant.character.escape.continuation.makefile
    constant.character.escape.line-continuation.makefile

- &SCOPE_var >-
    variable.other.makefile

- &SCOPE_varAsgn >-
    variable.other.assignment.makefile

- &SCOPE_expPunct_open >-
    punctuation.definition.variable.makefile
    punctuation.definition.template-expression.begin.makefile

- &SCOPE_expPunct_close >-
    punctuation.definition.variable.makefile
    punctuation.definition.template-expression.end.makefile

- &SCOPE_recipe__ >-
    meta.scope.recipe.makefile

- &SCOPE_recipeLN >-
    meta.scope.recipe.line.makefile

- &SCOPE_recipeRH >-
    meta.scope.recipe.rulehead.makefile

- &SCOPE_recipeLnPfx >-
    keyword.control.recipe-lineprefix.makefile

- &SCOPE_str >-
    meta.string.makefile
    string.unquoted.makefile

- &SCOPE_target_special >-
    support.function.target.$1.makefile

# substref scopes:
- &SCOPE_sr_met meta.substref.makefile
- &SCOPE_sr_col >-
    punctuation.separator.substref.colon.makefile
    support.function.substref.colon.makefile
    keyword.operator.substref.colon.makefile
- &SCOPE_sr_eql >-
    punctuation.separator.substref.equal.makefile
    support.function.substref.equal.makefile
    keyword.operator.substref.equal.makefile
- &SCOPE_sr_per >-
    constant.other.placeholder.substref.percent.makefile
    keyword.other.operator.substref.percent.makefile
    variable.other.constant.substref.percent.makefile

- &__notExp |-
    (?x)
    ( [^ $]++
    | (\$\$)++
    )++

- &__specialTargets |-
    (?x)
    (?# special targets: )
    (?<![^ ])
    ( \.DEFAULT
    | \.DELETE_ON_ERROR
    | \.EXPORT_ALL_VARIABLES
    | \.IGNORE
    | \.INTERMEDIATE
    | \.LOW_RESOLUTION_TIME
    | \.NOTINTERMEDIATE
    | \.NOTPARALLEL
    | \.ONESHELL
    | \.PHONY
    | \.POSIX
    | \.PRECIOUS
    | \.SECONDARY
    | \.SECONDEXPANSION
    | \.SILENT
    | \.SUFFIXES
    | \.WAIT
    )
    (\z|(?=[ ]))


# built-in functions anchors
# --------------------------

- &__builtInFunc_multiary |-
    (?x)
    \G
    (?# built-in functions -> )
    (?# ref.: function.c -> struct function_table_entry + guile)
    ( abspath
    | addprefix
    | addsuffix
    | and
    | basename
    | call
    | dir
    | error
    | eval
    | file
    | filter
    | filter-out
    | findstring
    | firstword
    | foreach
    | guile
    | if
    | info
    | intcmp
    | join
    | lastword
    | let
    | notdir
    | or
    | patsubst
    | realpath
    | shell
    | sort
    | strip
    | subst
    | suffix
    | value
    | warning
    | wildcard
    | word
    | wordlist
    | words
    )
    (?=[ \\])



repository:


# ------------------------ misc. rules ------------------------ #

  esc-backslashes:
    patterns:
    - match: (\\)(\\)
      captures:
        "1": { name: constant.character.escape.backslash.makefile }
        "2": { name: meta.escaped-char.makefile }

  doubleDollar:
    match: (\$\$)+
    name: constant.character.escape.dollar.makefile

  comma-condition:
    match: ","
    name: punctuation.separator.delimiter.comma.makefile

  comma-funcargs:
    match: ","
    name: punctuation.separator.delimiter.comma.makefile

  comment:
    patterns:
    - include: "#quoted-hash"
    - include: "#comment-actual"
    repository:
      comment-actual:
        begin: |-
          (?x)
          (     ^[ ]++       )?  # "1": if at BOL: any leading whitespace
          (?<!  \\           )   # otherwise unreliable \ count -> don't match
          (     (?: \\{2} )*+)   # "2": any even no. of \-s -> quoting \-es
          (?=   \#           )   # an (unquoted) # on next position
        beginCaptures:
          "1": { name: punctuation.whitespace.comment.leading.makefile }
          "2": { patterns: [include: "#esc-backslashes"] }
        end: (?!\G)
        patterns:
        - begin: \#
          beginCaptures:
            "0": { name: punctuation.definition.comment.makefile }
          end:   (?=\n)
          applyEndPatternLast: 1
          name: comment.line.number-sign.makefile
          patterns:
          - include: "#line-cont"
      quoted-hash:
        match: |-
          (?x)
          (?<!    \\        )   # otherwise unreliable \ count -> don't match
          (   (?: \\{2} )*+ )   # "1": any even no. of \-s -> quoting \-es
                 (\\)(\#)       # "2": the quoted #
        captures:
          "1": { patterns: [include: "#esc-backslashes"] }
          "2": { name: constant.character.escape.backslash.makefile }
          "3": { name: meta.escaped-char.makefile }

  __lineCont:
    match: &__lineCont |-
      (?=\\+\n)

  line-cont:
    begin: *__lineCont
    end:   (?!\G)
    applyEndPatternLast: 1
    patterns:
    - include: "#esc-backslashes"
    - begin: \\$
      end:   ^
      beginCaptures:
        "0": { name: *SCOPE_lineCont }

  line-cont-recipe:
    begin: *__lineCont
    end:   (?!\G)
    applyEndPatternLast: 1
    patterns:
    - include: "#esc-backslashes"
    - begin: \\$
      end:   ^
      beginCaptures:
        "0": { name: *SCOPE_lineCont }

  percent:
    match: \\*%
    captures:
      "0":
        patterns:
        - include: "#esc-backslashes"
          # for any sequence of (backslashes + %), any leading pairs of backslashes means the first backslash in the pair escapes the second backslash
          # at this point, we know that what remains is either
          #   - \%   i.e. an escaped %, or
          #   -  %   i.e. a plain %
        - match: (\\)(%)
          captures:
            "1": { name: constant.character.escape.backslash.makefile }
            "2": { name: meta.escaped-char.makefile }
        - match: '%'
          name: >-
            constant.other.placeholder.percent.makefile
            keyword.other.operator.percent.makefile
            variable.other.constant.percent.makefile
        - match: .*
          name: *SCOPE_str  # not expected to be assigned

  wildcard:
    match: \\*[*?\[\]]
    # same structure as "percent" - see that rule for explanation
    captures:
      "0":
        patterns:
        - include: "#esc-backslashes"
        - match: (\\)([*?\[\]])
          captures:
            "1": { name: constant.character.escape.backslash.makefile }
            "2": { name: meta.escaped-char.makefile }
        - match: '[*?\[\]]'
          name: >-
            variable.language.special.wildcard.makefile
            string.regexp.makefile

        - match: .*
          name: *SCOPE_str  # not expected to be assigned


# ------------------------- directives ------------------------ #

  directives:

    patterns:
    - include: "#include-directive"
    - include: "#load"
    - include: "#vpath"
    - include: "#define"
    - include: "#export"
    - include: "#undefine"
    - include: "#override"
    - include: "#private"
    - include: "#unexport"
    - include: "#conditional"

    repository:

      include-directive:
        begin: ^[ ]*([s\-]?include)\b
        beginCaptures:
          "1": { name: keyword.control.include.makefile }
        end:   ^
        patterns:
        - include: "#comment"
        - include: "#doubleDollar"
        - include: "#expansions"
        - include: "#percent"

      load:
        patterns:
        - begin: ^[ ]*([-]?load)\b
          beginCaptures:
            "1": { name: keyword.control.load.makefile }
          end:   ^
          patterns:
          - include: "#comment"
          - include: "#load-symbolname"
          - include: "#doubleDollar"
          - include: "#expansions"
        repository:
          load-symbolname:
            begin: (?x) \(
            end:   (?x) \) | (?=\n)
            applyEndPatternLast: 1
            contentName: meta.scope.load-symbolname.makefile
            captures:
              "0": { name: punctuation.definition.parameters.load-symbolname.makefile punctuation.section.load-symbolname.makefile}
            patterns:
            - include: "#doubleDollar"
            - include: "#expansions"
            - include: "#line-cont"

      vpath:
        begin: ^[ ]*(vpath)\b
        beginCaptures:
          "1": { name: keyword.control.vpath.makefile }
        end:   ^
        patterns:
        - include: "#comment"
        - include: "#doubleDollar"
        - include: "#expansions"
        - include: "#percent"
        - match: ':'
          name: punctuation.separator.paths.vpath.makefile

      define:
        begin: |-
          (?x)
          ^
          \s*+  (                    # "1", optional
                  (?: (?: override
                      ) [\ \t]++
                  )*+
                )
              (\b define   \b)       # "2", required
          \s*   (                    # "3", required
                  (?: [^\s#=!+?:]++    # >=1 of the subsequences
                  |   ! (?!    =)
                  |  \+ (?!    =)
                  |  \? (?!    =)
                  |   : (?!:?:?=)
                  )++
                )
          \s*   (                    # "4", optional
                  (?: [!+?]            # optional prefix...
                  |   :{0,3}
                  )
                  =                    # ...and "="
                )?
        beginCaptures:
          "1": { name: keyword.control.override.makefile }
          "2": { name: keyword.control.define.makefile }
          "3":
            name: *SCOPE_varAsgn
            patterns:
            - include: "#varname-parts"
          "4": { name: keyword.operator.assignment.makefile }
        end: ^\s*(endef)\b
        endCaptures:
          "1": { name: keyword.control.endef.makefile }
        name: meta.scope.define.makefile
        patterns:
        # this list will never be looped over - each item matched at most once
          # define head: detect comments:
        - begin: \G(?!^)
          end:   ^
          patterns:
          - include: "#comment"
          # define body:
        - begin: ^
          end:   ^(?=\s*(endef)\b)
          name: meta.scope.define.body.makefile
          patterns:
          - include: "#define"
          - include: "#define-body"

      define-body:
        patterns:
        - include: "#doubleDollar"
        - include: "#expansions"
        - match: '[^\$]+'
          name: *SCOPE_str
        - match: .
          name: *SCOPE_str

      directive-varname:
        match: \S+
        name: *SCOPE_var
        captures: { "0": { patterns: [include: "#varname-specialVar"] } }

      export:
        begin: ^[ ]*(export)\b
        beginCaptures:
          "1": { name: keyword.control.export.makefile }
        end:   ^
        patterns:
        - include: "#comment"
        - include: "#variable-assignment"
        - include: "#directive-varname"

      undefine:
        begin: ^[ ]*(undefine)\b
        beginCaptures:
          "1": { name: keyword.control.undefine.makefile }
        end:   ^
        patterns:
        - include: "#comment"
        - include: "#directive-varname"

      override:
        begin: ^[ ]*(override)\b
        beginCaptures:
          "1": { name: keyword.control.override.makefile }
        end:   ^
        patterns:
        - include: "#comment"
        - include: "#variable-assignment"

      private:
        begin: ^[ ]*(private)\b
        beginCaptures:
          "1": { name: keyword.control.private.makefile }
        end:   ^
        patterns:
        - include: "#comment"
        - include: "#variable-assignment"

      unexport:
        begin: ^[ ]*(unexport)\b
        beginCaptures:
          "1": { name: keyword.control.unexport.makefile }
        end:   ^
        patterns:
        - include: "#comment"
        - include: "#directive-varname"

      condition-varname:
        # \G is the position just after the keyword
        match: |-
          (?x)
          \G (?<= ifdef|ifndef )
          [ \t]+
          ( (?: [^\s#\\]
            |   \\ (?!\n)   # a \ ending the line continues it
            )+
          )
        captures:
          "1":
            name: *SCOPE_var
            patterns:
            - include: "#varname-parts"

      condition-body:
        patterns:
        - include: "#condition-varname"
        - include: "#comma-condition"
        - include: "#doubleDollar"
        - include: "#expansions"
        - include: "#comment"

      conditional:
        begin: ^\s*(ifeq|ifneq|ifdef|ifndef)(?=\s)
        captures:
          "1": { name: keyword.control.$1.makefile }
        end:   ^\s*(endif)\b
        name: meta.scope.conditional.makefile
        patterns:
        - begin: \G
          end:   ^
          name: meta.scope.condition.makefile
          patterns: [include: "#condition-body"]
        - begin: ^\s*else(?=\s)\s*(ifeq|ifneq|ifdef|ifndef)*(?=\s)
          beginCaptures:
            "0": { name: keyword.control.else.makefile }
          end:   ^
          patterns: [include: "#condition-body"]
        - include: $self


# ----------------------- var assignment ---------------------- #

  __varAssignBegin:
    match: &__varAssignBegin |-
      (?x)
      (?:  ^[\ ]*+|\G\s*+ ) # discard leading whitespace
      ( (?:        [^!+?=\s$:#\\]++
        |   (?<!\\) [!+?] (?!=)
        |   \\
        |   \g<exp>
        |   \$(?! [({] )
        )++
      )  # group 1; the variable name
      \s*+                  # any space between name and assignment operator
                            # assignment operators:
      ( (?<![?:+!])   =     #    =
      |              !=     #   !=
      |             \+=     #   +=
      |             \?=     #   ?=
      |              :=     #   :=
      |             ::=     #  ::=
      |            :::=     # :::=
      )
      (?:[ \t]*+)
      # define named groups for recursive expansion detection:
      (?<_ch>  [^(){}\n]+                                               ){0}
      (?<exp>  (?<![^$]\$) (?: (?: \$\{ (?:\g<exp>|\g<_ch>)*  \} )++
                           |   (?: \$\( (?:\g<exp>|\g<_ch>)*  \) )++ )  ){0}

  variable-assignment:
    begin: *__varAssignBegin
    beginCaptures:
      "1":
        name: *SCOPE_varAsgn
        patterns:
        - include: "#varname-parts"
      "2": { name: keyword.operator.assignment.makefile }
    end: (?=\n)
    applyEndPatternLast: 1
    name: meta.expression.assignment.makefile
    patterns:
    - include: "#line-cont"
    - include: "#comment"
    - include: "#doubleDollar"
    - include: "#expansions"
    - match: '[^\n\$#\\]+'
      name: *SCOPE_str
    - match: '[^\n]'
      name: *SCOPE_str


# --------------------------- rules --------------------------- #

  __ruleheadBegin:
    # We must decide with a single regex whether we have a rulehead or not - make a sensible effort. The key is identifying the rulehead colon + friends reliably.
    # Possessively eat anything that could be part of the target list before the colon, but importantly, NOT the colon - it must be carefully protected in the eating phase. When this eating is done, we are positioned to attempt to match one of the colon separators - if one matches, we go for a rulehead.
    match: &__ruleheadBegin |-
      (?x)
      ^(?!\t)             # recipe line - fail the match
      [ ]*+               # eat leading whitespace

      (                   # "1": name of target(s)
        (?:
          (?:[^$&:#\\])++ # chars we can eat carelessly
        | \\    [:#\\]    # eat escaped variants of these
        | \\              # after the above, we can eat any backslash
        | \g<exp>         # expansions (important: includes $(substref:colons))
        | \$(?! [({] )    # eat $<char> expansions
        | &(?!:)          # an `&` not followed by colon - eat!
                          # (note: with `\&`, make does NOT treat & as escaped)
                          # (importantly, we never eat unescaped #-s)
        )++
      )

      (                   # "2": the separator after the target(s)
         ::
      |  :
      | &::
      | &:
      )

      (?!\=)              # the : was part of ':=' (= an assignment)

      # define named groups for recursive expansion detection:
      (?<_ch>  [^(){}\n]+                                               ){0}
      (?<exp>  (?<![^$]\$) (?: (?: \$\{ (?:\g<exp>|\g<_ch>)*  \} )++
                           |   (?: \$\( (?:\g<exp>|\g<_ch>)*  \) )++ )  ){0}

  rulehead:
    name: meta.scope.rulehead.makefile
    begin: *__ruleheadBegin
    beginCaptures:
      "1":
        name: meta.scope.target.makefile
        patterns:
        - match: '[ ]+'
        - match: *__specialTargets
          captures: { "1": { name: *SCOPE_target_special } }
        # a target, possibly with expansion(s):
        - begin: (?<![^ ])
          end:   \z|(?=[ ])
          patterns:
          - include: "#expansions"
          - match: *__notExp
            # need a separate match for non-expansions - we don't want to scope expansions in targets with entity.name.function.target
            name: entity.name.function.target.makefile
            captures:
              "0":
                patterns:
                - include: "#wildcard"
                - include: "#percent"
                - include: "#doubleDollar"
      "2": { name: punctuation.separator.key-value.rulehead.makefile }
    end:   (?=\n)
    applyEndPatternLast: 1
    patterns:
    - begin: \G(?!\n|;)
      end:     (?=\n|;)
      applyEndPatternLast: 1
      contentName: meta.scope.prerequisites.makefile
      patterns:
      - match: '[ ]+'
      - include: "#line-cont"
      - include: "#wildcard"
      - include: "#percent"
      - include: "#comment"
      - include: "#doubleDollar"
      - include: "#expansions"
    - begin: ;
      beginCaptures:
        "0": { name: punctuation.separator.key-value.rulehead.recipe.makefile }
      end:   (?=\n)
      contentName: *SCOPE_recipeRH
      applyEndPatternLast: 1
      patterns:
      - include: "#recipe"

  recipe:
    begin: (?!\n)
    end:   (?=\n)
    name: *SCOPE_recipe__
    applyEndPatternLast: 1
    patterns:
    - match: \G[\t @+\-]+
      captures:
        "0": { patterns: [{ match: '[@+\-]+', name: *SCOPE_recipeLnPfx }] }
    - include: "#line-cont-recipe"
    - include: "#doubleDollar"
    - include: "#expansions"

  recipe-line:
    name: *SCOPE_recipeLN
    begin: ^[\t](?!\n)
    end:        (?=\n)
    applyEndPatternLast: 1
    patterns:
    - include: "#recipe"


# ------------------------- expansions ------------------------ #

  # rule naming conventions
    # examples:
    #   _$c_             <=>  captures $<char>
    #   *_pp_*           <=>  captures $(..)
    #   *_bb_*           <=>  captures ${..}

  expansions:
    # entry point for all searches for variable expansions
    patterns:
    - include: "#expansions_$c_"
    - include: "#expansions_pp_"
    - include: "#expansions_bb_"

  expansions_$c_:
    # with e.g. `$@`, both chars should be scoped "automatic"
    match: \$[^({$#\n ]
    captures:
      "0":
        patterns:
        - include: "#varname-automatic"
        - include: "#varname-positional"
        - include: "#varname-userSingleChar"

  expansions_pp_:
    patterns:
    - begin: (?x) \$\(
      end:   (?x)   \) | (?=\n)
      beginCaptures: { "0": { name: *SCOPE_expPunct_open } }
      endCaptures:   { "0": { name: *SCOPE_expPunct_close } }
      contentName: meta.scope.expansion.makefile
      applyEndPatternLast: 1
      patterns:
      - include: "#line-cont"
      - include: "#expansions_pp_func-builtin_multiary"
      - include: "#expansions_pp_func-builtin_varUnary"
      - include: "#expansions"
      - include: "#varname-specialVar"
      - include: "#varname-automatic"
      - include: "#varname-positional"
      - include: "#substref-segment"
      - include: "#varname-segment"
      - { match: '\}', name: *SCOPE_var }

  expansions_bb_:
    patterns:
    - begin: (?x) \$\{
      end:   (?x)   \} | (?=\n)
      beginCaptures: { "0": { name: *SCOPE_expPunct_open } }
      endCaptures:   { "0": { name: *SCOPE_expPunct_close } }
      contentName: meta.scope.expansion.makefile
      applyEndPatternLast: 1
      patterns:
      - include: "#line-cont"
      - include: "#expansions_bb_func-builtin_multiary"
      - include: "#expansions_bb_func-builtin_varUnary"
      - include: "#expansions"
      - include: "#varname-specialVar"
      - include: "#varname-automatic"
      - include: "#varname-positional"
      - include: "#substref-segment"
      - include: "#varname-segment"
      - { match: '\)', name: *SCOPE_var }

  expansions_pp_func-builtin_multiary:
    patterns:
    - begin: *__builtInFunc_multiary
      end:   (?x) (?= \)) | (?=\n)
      beginCaptures: { "1": { name: support.function.$1.makefile } }
      name:        meta.scope.function-call.makefile
      applyEndPatternLast: 1
      patterns:
      - include: "#comma-funcargs"
      - include: "#doubleDollar"
      - include: "#expansions"
      - include: "#expansions--func-builtin-NESTED"
      - include: "#line-cont"

  expansions_bb_func-builtin_multiary:
    patterns:
    - begin: *__builtInFunc_multiary
      end:   (?x) (?= \}) | (?=\n)
      beginCaptures: { "1": { name: support.function.$1.makefile } }
      name:        meta.scope.function-call.makefile
      applyEndPatternLast: 1
      patterns:
      - include: "#comma-funcargs"
      - include: "#doubleDollar"
      - include: "#expansions"
      - include: "#expansions--func-builtin-NESTED"
      - include: "#line-cont"

  expansions_pp_func-builtin_varUnary:
    patterns:
    - begin: (?<=\()(origin|flavor)\s(?=[^\s)]+\s*\))
      end:   (?=\))
      beginCaptures: { "1": { name: support.function.$1.makefile } }
      name: meta.scope.function-call.makefile
      contentName: *SCOPE_var
      patterns:
      - include: "#doubleDollar"
      - include: "#expansions"

  expansions_bb_func-builtin_varUnary:
    patterns:
    - begin: (?<={)(origin|flavor)\s(?=[^\s}]+\s*})
      end:   (?=})
      beginCaptures: { "1": { name: support.function.$1.makefile } }
      name: meta.scope.function-call.makefile
      contentName: *SCOPE_var
      patterns:
      - include: "#doubleDollar"
      - include: "#expansions"


  # "*NESTED*" rules
  # ----------------

  # intended to track nested (..)s and {..}s in function arguments
  #
  # example:
  #   `$(info a(b)c)` -> GNU make prints "a(b)c"
  #   i.e. ")" after "b" does _not_ end the argument to `info`
  #
  # note: make.tmbundle rules corresponding to these use scope names /.*interpolation.*/.

  expansions--func-builtin-NESTED:
    patterns:
    - include: "#expansions--func-builtin-NESTED_pp_"
    - include: "#expansions--func-builtin-NESTED_bb_"
    repository:
      expansions--func-builtin-NESTED_pp_:
        begin: (?x) \(
        end:   (?x) \) | (?=\n)
        name: meta.scope.function-call.parens-group.makefile
        applyEndPatternLast: 1
        patterns:
        - include: "#doubleDollar"
        - include: "#expansions"
        - include: "#expansions--func-builtin-NESTED"
        - include: "#line-cont"
      expansions--func-builtin-NESTED_bb_:
        begin: (?x) \{
        end:   (?x) \} | (?=\n)
        name: meta.scope.function-call.braces-group.makefile
        applyEndPatternLast: 1
        patterns:
        - include: "#doubleDollar"
        - include: "#expansions"
        - include: "#expansions--func-builtin-NESTED"
        - include: "#line-cont"


# ----------------------- variable names ---------------------- #

  varname-parts:
    patterns:
    - include: "#doubleDollar"
    - include: "#expansions"
    - include: "#varname-specialVar"

  varname-specialVar:
    # the two anchorings must stay paired: \G is inert at the start of a
    # re-tokenized capture, \z outside one (the tokenized line ends with \n)
    patterns:
    # special variable -> mutable:
    - match: |-
        (?x)
        (?: \G         \g<varname> (?= [:)}] )  # an expansion's name slot
        |   (?<![^\s]) \g<varname> (?= \z    )  # a captured name, in full
        )
        (?<varname>
          COMSPEC
        | GNUMAKEFLAGS
        | GPATH
        | MAKE
        | MAKEFILES
        | MAKEFLAGS
        | MAKEOVERRIDES
        | MAKESHELL
        | MAKE_TERMERR
        | MAKE_TERMOUT
        | MFLAGS
        | SHELL
        | SUFFIXES
        | VPATH
        | \.DEFAULT_GOAL
        | \.EXTRA_PREREQS
        | \.LIBPATTERNS
        | \.RECIPEPREFIX
        | \.SHELLFLAGS
        ){0}
      name: >-
        variable.language.readwrite.makefile
        variable.other.constant.makefile

    # special variable -> immutable:
    - match: |-
        (?x)
        (?: \G         \g<varname> (?= [:)}] )  # an expansion's name slot
        |   (?<![^\s]) \g<varname> (?= \z    )  # a captured name, in full
        )
        (?<varname>
          CURDIR
        | MAKECMDGOALS
        | MAKEFILE_LIST
        | MAKELEVEL
        | MAKE_HOST
        | MAKE_RESTARTS
        | MAKE_TMPDIR
        | MAKE_VERSION
        | \.FEATURES
        | \.INCLUDE_DIRS
        | \.LOADED
        | \.SHELLSTATUS
        | \.VARIABLES
        | -\*-eval-flags-\*-
        | -\*-command-variables-\*-
        ){0}
      name: >-
        variable.language.constant.makefile
        constant.language.makefile

  varname-automatic:
    # need to handle two forms:
    patterns:
    # ...$(@); cursor is on @:
    - match: |-
        (?x)
            (?<= \$[({] )  [@%<?^+|*]  [FD]  (?= [)}:\\] )  # $(@F)
        |   (?<= \$[({] )  [@%<?^+|*]        (?= [)}:\\] )  # $(@)
      name: >-
        variable.parameter.automatic.makefile
    # ...$@; cursor on $:
    - match: (?x) (\$) ([@%<?^+|*])
      name: >-
        variable.parameter.automatic.makefile
      captures:
        "1":
          name: >-
            punctuation.definition.variable.makefile
        "2":
          name: meta.scope.expansion.makefile

  varname-positional:
    # structure + comments: see `varname-automatic`
    patterns:
    - match: (?x) (?<= \$[({] ) [0-9]  (?= [)}:\\] )
      name: >-
        variable.parameter.positional.makefile
    - match: (?x) (\$) ([0-9])
      name: >-
        variable.parameter.positional.makefile
      captures:
        "1":
          name: >-
            punctuation.definition.variable.makefile
        "2":
          name: meta.scope.expansion.makefile

  varname-userSingleChar:
    # with e.g. $c, cursor is always on $
    patterns:
    - match: (\$)([^({$#\n ])
      # make sure *SCOPE_var becomes the innermost/top scope:
      captures:
        "1":
          name: punctuation.definition.variable.makefile
          patterns:
          - match: \$
            name:  *SCOPE_var
        "2":
          name: meta.scope.expansion.makefile
          patterns:
          - match: '[^({$#\n ]'
            name:  *SCOPE_var

  substref-segment:
    begin: ':'
    end:   (?x) (?= \)|\} ) | (?=\n)
    beginCaptures: { "0": { name: *SCOPE_sr_col } }
    name: *SCOPE_sr_met
    patterns:
    - include: "#doubleDollar"
    - include: "#expansions"
    - include: "#line-cont"
    - { match: '%'      , name: *SCOPE_sr_per }
    - { match: '='      , name: *SCOPE_sr_eql }
    - { match: '[^%=\s]', name: *SCOPE_str }

  varname-segment:
    match: |-
      (?x)
      (?: [^$\\:)}\n]+
      |   (\$\$)+
      |   \\ (?! \\* \n)   # eat if not appearing to be part of line-cont.
                           # (in varnames, \-s escapes nothing but \n)
      )+
    name: *SCOPE_var
    captures: { "0": { patterns: [include: "#doubleDollar"] } }

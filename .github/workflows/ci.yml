name: ci
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to publish (e.g. v1.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: sudo apt-get install -y zsh pcre2-utils

      - name: Verify generated files are up to date
        run: make check

      - name: Run tests
        run: make test NOTRACE=1

  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: sudo apt-get install -y zsh pcre2-utils

      - name: Build + package extension
        run: pnpm run vsix

      - name: Create release, upload assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            syntaxes/makefile.tmLanguage.json
            syntaxes/makefile.scopes.txt
            better-makefile.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [check, release]
    if: ${{ !cancelled() && needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write  # for OIDC trusted publishing

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Download the released .vsix
        run: gh release download ${{ inputs.tag || github.ref_name }} -p '*.vsix'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Publish to VS Code Marketplace
        run: npx -y @vscode/vsce@4 publish --oidc --skip-duplicate --packagePath better-makefile.vsix
